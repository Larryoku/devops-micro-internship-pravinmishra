---
- name: Setup Nginx Web Server on Ubuntu EC2
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx service is enabled and running
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Ensure /var/www/html directory exists
      file:
        path: /var/www/html
        state: directory
        mode: '0755'

    - name: Set ownership of /var/www/html to ubuntu user
      file:
        path: /var/www/html
        owner: ubuntu
        group: ubuntu
        mode: '0755'
        recurse: yes
