---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes

- name: Install baseline packages
  apt:
    name: "{{ system_packages }}"
    state: present

- name: Ensure SSH key-based authentication is working
  command: whoami
  register: whoami_result
  changed_when: false

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

- name: Enable UFW firewall
  ufw:
    state: enabled

- name: Allow SSH through UFW
  ufw:
    rule: allow
    port: "22"
    proto: tcp
